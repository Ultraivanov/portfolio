<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://unpkg.com 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://api.github.com https://github.com https://raw.githubusercontent.com https://unpkg.com; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'"
    />
    <base href="/admin/" />
    <title>Content Manager</title>
  </head>
  <body>
    <script>
      (function () {
        function storeToken(token, provider) {
          try {
            var payload = JSON.stringify({ token: token, provider: provider });
            window.localStorage.setItem("netlify-cms-user", payload);
            window.localStorage.setItem("decap-cms-user", payload);
          } catch (e) {
            console.warn("CMS login: unable to write localStorage", e);
          }
        }

        window.addEventListener("message", function (event) {
          if (event.origin !== window.location.origin) return;
          if (typeof event.data !== "string") return;
          if (!event.data.startsWith("authorization:")) return;
          var parts = event.data.split(":");
          if (parts.length < 4 || parts[2] !== "success") return;
          try {
            var payload = JSON.parse(parts.slice(3).join(":"));
            if (payload && payload.token) {
              storeToken(payload.token, payload.provider || "github");
              window.location.reload();
            }
          } catch (e) {
            console.warn("CMS login: failed to parse message", e);
          }
        });

        var hash = window.location.hash || "";
        if (!hash.includes("cms_token=")) return;
        var cleaned = hash.replace(/^#\/?/, "");
        var query = cleaned.includes("?") ? cleaned.split("?")[1] : cleaned;
        var params = new URLSearchParams(query);
        var token = params.get("cms_token");
        if (!token) return;
        var provider = params.get("provider") || "github";
        var message =
          "authorization:" +
          provider +
          ":success:" +
          JSON.stringify({ token: token, provider: provider });
        storeToken(token, provider);
        var origin = window.location.origin;
        var attempts = 0;
        var timer = setInterval(function () {
          attempts += 1;
          window.postMessage(message, origin);
          if (window.CMS || attempts > 20) {
            clearInterval(timer);
            window.history.replaceState(null, "", "/admin/#/");
          }
        }, 300);
      })();
    </script>
    <script src="https://unpkg.com/decap-cms@^3/dist/decap-cms.js"></script>
  </body>
</html>
