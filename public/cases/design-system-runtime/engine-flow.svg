<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" style="background:#0a0a0f">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/>
    </marker>
    <marker id="arrowSuccess" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981"/>
    </marker>
    <marker id="arrowError" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef4444"/>
    </marker>

    <!-- Node gradients -->
    <linearGradient id="inputGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="parserGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b2d5c"/>
      <stop offset="100%" style="stop-color:#1e1b4b"/>
    </linearGradient>
    <linearGradient id="runnerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5c3d2d"/>
      <stop offset="100%" style="stop-color:#291b12"/>
    </linearGradient>
    <linearGradient id="detectorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d5c3d"/>
      <stop offset="100%" style="stop-color:#1b2912"/>
    </linearGradient>
    <linearGradient id="ruleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5c2d4d"/>
      <stop offset="100%" style="stop-color:#29121f"/>
    </linearGradient>
    <linearGradient id="reportGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d4d5c"/>
      <stop offset="100%" style="stop-color:#121f29"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="500" y="40" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#e5e7eb">Engine Interaction Flow</text>

  <!-- ===== INPUT NODE ===== -->
  <rect x="50" y="80" width="160" height="80" rx="12" fill="url(#inputGrad)" stroke="#3b82f6" stroke-width="2"/>
  <circle cx="70" cy="100" r="8" fill="#3b82f6"/>
  <text x="130" y="105" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#60a5fa">INPUT</text>
  <text x="130" y="125" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">DESIGN.md</text>
  <text x="130" y="140" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b">URL + Flow</text>

  <!-- Flow: Input → Parser -->
  <path d="M 210 120 L 280 120" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="245" y="110" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6b7280">raw spec</text>

  <!-- ===== PARSER NODE ===== -->
  <rect x="280" y="80" width="160" height="80" rx="12" fill="url(#parserGrad)" stroke="#8b5cf6" stroke-width="2"/>
  <circle cx="300" cy="100" r="8" fill="#8b5cf6"/>
  <text x="360" y="105" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#a78bfa">PARSER</text>
  <text x="360" y="125" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">Markdown → AST</text>
  <text x="360" y="140" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b">YAML validation</text>

  <!-- Flow: Parser → Runner -->
  <path d="M 360 160 L 360 200 L 360 200" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="375" y="185" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6b7280">AST</text>

  <!-- ===== FLOW RUNNER NODE ===== -->
  <rect x="280" y="200" width="160" height="80" rx="12" fill="url(#runnerGrad)" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="300" cy="220" r="8" fill="#f59e0b"/>
  <text x="360" y="225" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#fbbf24">FLOW RUNNER</text>
  <text x="360" y="245" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">Playwright</text>
  <text x="360" y="260" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b">Browser automation</text>

  <!-- Flow: Runner → Product -->
  <path d="M 210 240 L 280 240" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="245" y="230" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6b7280">execute</text>

  <!-- ===== PRODUCT (External) ===== -->
  <rect x="50" y="200" width="160" height="80" rx="12" fill="#1f2937" stroke="#6b7280" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="130" y="230" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#9ca3af">🌐 PRODUCT</text>
  <text x="130" y="250" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6b7280">staging / prod</text>
  <text x="130" y="265" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#4b5563">Real UI states</text>

  <!-- Return: Product → Runner -->
  <path d="M 210 260 L 280 260" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="245" y="280" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6b7280">DOM + events</text>

  <!-- Flow: Runner → Detector -->
  <path d="M 440 240 L 520 240" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="480" y="230" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6b7280">interaction log</text>

  <!-- ===== STATE DETECTOR NODE ===== -->
  <rect x="520" y="200" width="160" height="80" rx="12" fill="url(#detectorGrad)" stroke="#10b981" stroke-width="2"/>
  <circle cx="540" cy="220" r="8" fill="#10b981"/>
  <text x="600" y="225" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#34d399">DETECTOR</text>
  <text x="600" y="245" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">Heuristics</text>
  <text x="600" y="260" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b">loading, error, empty</text>

  <!-- Flow: Detector → Rule Engine -->
  <path d="M 600 280 L 600 320" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="615" y="305" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6b7280">actual states</text>

  <!-- ===== RULE ENGINE NODE ===== -->
  <rect x="520" y="320" width="160" height="80" rx="12" fill="url(#ruleGrad)" stroke="#ec4899" stroke-width="2"/>
  <circle cx="540" cy="340" r="8" fill="#ec4899"/>
  <text x="600" y="345" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#f472b6">RULE ENGINE</text>
  <text x="600" y="365" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">Expected vs Actual</text>
  <text x="600" y="380" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b">Comparator + Diff</text>

  <!-- Parallel: Parser → Rule Engine (expected path) -->
  <path d="M 440 120 L 480 120 L 480 360 L 520 360" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrow)"/>
  <text x="490" y="110" text-anchor="start" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#3b82f6">expected states</text>

  <!-- Flow: Rule Engine → Report -->
  <path d="M 680 360 L 760 360" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="720" y="350" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#6b7280">diff result</text>

  <!-- ===== REPORT ENGINE NODE ===== -->
  <rect x="760" y="320" width="160" height="80" rx="12" fill="url(#reportGrad)" stroke="#06b6d4" stroke-width="2"/>
  <circle cx="780" cy="340" r="8" fill="#06b6d4"/>
  <text x="840" y="345" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#22d3ee">REPORT</text>
  <text x="840" y="365" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">Product Insights</text>
  <text x="840" y="380" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b">Missing, Broken, Unreachable</text>

  <!-- ===== OUTPUT ===== -->
  <rect x="760" y="450" width="160" height="80" rx="12" fill="#1f2937" stroke="#10b981" stroke-width="2"/>
  <text x="840" y="480" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#34d399">📊 OUTPUT</text>
  <text x="840" y="500" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">Issues list</text>
  <text x="840" y="515" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b">Product language</text>

  <!-- Flow: Report → Output -->
  <path d="M 840 400 L 840 450" stroke="#10b981" stroke-width="2" marker-end="url(#arrowSuccess)"/>

  <!-- Error branch -->
  <path d="M 600 400 L 600 450 L 520 450" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrowError)"/>
  <text x="560" y="470" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#ef4444">validation errors</text>

  <!-- Error storage -->
  <rect x="360" y="430" width="160" height="60" rx="8" fill="#29121b" stroke="#ef4444" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="440" y="455" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#f87171">Error Log</text>
  <text x="440" y="475" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#9ca3af">Broken transitions</text>

  <!-- Legend -->
  <text x="50" y="560" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#9ca3af">Legend:</text>

  <circle cx="70" cy="585" r="6" fill="#3b82f6"/>
  <text x="85" y="590" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#9ca3af">Input/Spec</text>

  <circle cx="200" cy="585" r="6" fill="#8b5cf6"/>
  <text x="215" y="590" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#9ca3af">Processing</text>

  <circle cx="340" cy="585" r="6" fill="#10b981"/>
  <text x="355" y="590" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#9ca3af">Detection</text>

  <circle cx="480" cy="585" r="6" fill="#ec4899"/>
  <text x="495" y="590" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#9ca3af">Validation</text>

  <circle cx="620" cy="585" r="6" fill="#06b6d4"/>
  <text x="635" y="590" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#9ca3af">Output</text>

  <!-- Notes -->
  <text x="50" y="640" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6b7280">• Linear execution with parallel expected/actual paths</text>
  <text x="50" y="660" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6b7280">• Dashed lines = data flow without execution</text>
  <text x="50" y="680" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6b7280">• Red path = error handling for broken transitions</text>

  <!-- n8n-style badge -->
  <rect x="850" y="580" width="100" height="30" rx="4" fill="#ff6d5a"/>
  <text x="900" y="600" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#fff">n8n style</text>
</svg>
