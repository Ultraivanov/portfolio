<text x="770" y="172" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="9" fill="#6d6d6d">scroll without criteria</text>
<line x1="722" y1="342" x2="647" y2="377" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>
