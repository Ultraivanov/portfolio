  <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#10b981"/>
  </marker>
</defs>
<text x="600" y="34" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="0.12em" fill="#6d6d6d">BEHAVIOR MODEL — DECISION FATIGUE LOOP</text>
<line x1="647" y1="102" x2="722" y2="137" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>
<ellipse cx="600" cy="80" rx="52" ry="32" fill="#1e1e20" stroke="#2f2f32" stroke-width="1"/>
<text x="600" y="76" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12" font-weight="500" fill="#fefaec">Vague Intent</text>
<text x="600" y="92" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="9" fill="#6d6d6d">I want a trip, but where?</text>
<line x1="770" y1="212" x2="770" y2="268" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>
