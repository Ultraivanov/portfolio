<text x="770" y="332" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="9" fill="#6d6d6d">compare without framework</text>
<line x1="552" y1="377" x2="477" y2="342" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>
<ellipse cx="600" cy="400" rx="52" ry="32" fill="#1e1e20" stroke="#2f2f32" stroke-width="1"/>
