<text x="600" y="412" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="9" fill="#6d6d6d">search reviews, ask friends</text>
<line x1="430" y1="268" x2="430" y2="212" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>
<ellipse cx="430" cy="320" rx="52" ry="32" fill="#1e1e20" stroke="#2f2f32" stroke-width="1"/>
<text x="430" y="316" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12" font-weight="500" fill="#fefaec">Postponed Decision</text>
<text x="430" y="332" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="9" fill="#6d6d6d">"I'll decide tomorrow"</text>
<line x1="477" y1="137" x2="552" y2="102" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>
<ellipse cx="430" cy="160" rx="52" ry="32" fill="#1e1e20" stroke="#2f2f32" stroke-width="1"/>
<text x="430" y="156" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12" font-weight="500" fill="#fefaec">Decision Fatigue</text>
<text x="430" y="172" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="9" fill="#6d6d6d">options feel equal / overwhelming</text>
<circle cx="600" cy="240" r="50" fill="#1e1e20" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="600" y="232" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12" font-weight="600" fill="#10b981">Design</text>
<text x="600" y="248" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12" font-weight="600" fill="#10b981">Intervention</text>
<text x="600" y="432" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11" fill="#a3a3a3">Users aren't solving a search problem — they're solving a decision problem</text>

