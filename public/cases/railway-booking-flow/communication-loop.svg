<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" style="background:#151414">
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#4b5563"/>
  </marker>
  <marker id="arr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#f59e0b"/>
  </marker>
</defs>
<text x="600" y="34" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="0.12em" fill="#6d6d6d">COMMUNICATION LOOP — CLOSED SYSTEM</text>
<rect x="86" y="160" width="148" height="72" rx="4" fill="#252528" stroke="#f59e0b" stroke-width="1.5"/>
<text x="160" y="184" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13" font-weight="500" fill="#fefaec">Submit Request</text>
<text x="160" y="203" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="10" fill="#a3a3a3">form + category</text>
<text x="160" y="217" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="10" fill="#a3a3a3">+ attachment</text>
<line x1="234" y1="196" x2="262" y2="196" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr-a)"/>
<rect x="262" y="160" width="148" height="72" rx="4" fill="#1e1e20" stroke="#2f2f32" stroke-width="1"/>
<text x="336" y="184" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13" font-weight="500" fill="#fefaec">Classification</text>
<text x="336" y="203" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="10" fill="#a3a3a3">type detection</text>
<text x="336" y="217" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="10" fill="#a3a3a3">+ priority</text>
<line x1="410" y1="196" x2="438" y2="196" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="438" y="160" width="148" height="72" rx="4" fill="#1e1e20" stroke="#2f2f32" stroke-width="1"/>
<text x="512" y="184" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13" font-weight="500" fill="#fefaec">Routing</text>
<text x="512" y="203" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="10" fill="#a3a3a3">department</text>
<text x="512" y="217" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="10" fill="#a3a3a3">assignment</text>
<line x1="586" y1="196" x2="614" y2="196" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="614" y="160" width="148" height="72" rx="4" fill="#1e1e20" stroke="#2f2f32" stroke-width="1"/>
<text x="688" y="184" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13" font-weight="500" fill="#fefaec">Processing</text>
<text x="688" y="203" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="10" fill="#a3a3a3">response</text>
<text x="688" y="217" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="10" fill="#a3a3a3">+ timeline</text>
<line x1="762" y1="196" x2="790" y2="196" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="790" y="160" width="148" height="72" rx="4" fill="#1e1e20" stroke="#2f2f32" stroke-width="1"/>
<text x="864" y="184" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13" font-weight="500" fill="#fefaec">Response</text>
<text x="864" y="203" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="10" fill="#a3a3a3">answer</text>
<text x="864" y="217" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="10" fill="#a3a3a3">+ status update</text>
<line x1="938" y1="196" x2="966" y2="196" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arr-a)"/>
<rect x="966" y="160" width="148" height="72" rx="4" fill="#252528" stroke="#f59e0b" stroke-width="1.5"/>
<text x="1040" y="184" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="13" font-weight="500" fill="#fefaec">Feedback</text>
<text x="1040" y="203" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="10" fill="#a3a3a3">user evaluation</text>
<text x="1040" y="217" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="10" fill="#a3a3a3">+ close / escalate</text>
<path d="M 1114 196 L 1134 196 L 1134 282 L 66 282 L 66 196 L 86 196" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
<text x="600" y="300" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="10" fill="#6d6d6d">closed loop — no open-ended threads</text>
<line x1="864" y1="160" x2="864" y2="120" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr-a)"/>
<text x="872" y="138" text-anchor="start" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="10" fill="#f59e0b">escalation path</text>
<text x="600" y="432" text-anchor="middle" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11" fill="#a3a3a3">Every request has a defined lifecycle — no ambiguous states</text>

</svg>