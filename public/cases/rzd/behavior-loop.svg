<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" fill="none" font-family="IBM Plex Sans, system-ui, sans-serif">
  <defs>
    <marker id="ab" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#3B82F6"/></marker>
    <marker id="ao" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#F59E0B"/></marker>
  </defs>
  <style>
    .n{fill:#3B82F6;rx:8} .no{fill:#F59E0B;rx:8} .l{fill:#fff;font-size:12.5px;font-weight:600} .sub{fill:#888;font-size:11px;font-style:italic}
    .ab{stroke:#3B82F6;stroke-width:2;fill:none;marker-end:url(#ab)} .ao{stroke:#F59E0B;stroke-width:1.8;stroke-dasharray:6 3;fill:none;marker-end:url(#ao)}
  </style>

  <!-- Title -->
  <text x="320" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a1a">Behavior Loop</text>

  <!-- Loop nodes in oval layout -->
  <!-- Top: Create Request -->
  <rect x="220" y="50" width="200" height="44" class="n" rx="8"/>
  <text x="320" y="77" text-anchor="middle" class="l">Create Request</text>

  <!-- Right: Assign Status -->
  <rect x="430" y="140" width="180" height="44" class="n" rx="8"/>
  <text x="520" y="167" text-anchor="middle" class="l">Assign Status</text>

  <!-- Right-bottom: Manager Review -->
  <rect x="400" y="240" width="200" height="44" class="n" rx="8"/>
  <text x="500" y="267" text-anchor="middle" class="l">Manager Review</text>

  <!-- Bottom: Response -->
  <rect x="220" y="330" width="200" height="44" class="n" rx="8"/>
  <text x="320" y="357" text-anchor="middle" class="l">Response</text>

  <!-- Left-bottom: Receive Response -->
  <rect x="30" y="240" width="190" height="44" class="n" rx="8"/>
  <text x="125" y="267" text-anchor="middle" class="l">Receive Response</text>

  <!-- Left: Evaluation -->
  <rect x="30" y="140" width="170" height="44" class="n" rx="8"/>
  <text x="115" y="167" text-anchor="middle" class="l">Evaluation</text>

  <!-- Escalation (orange) -->
  <rect x="220" y="190" width="160" height="44" class="no" rx="8"/>
  <text x="300" y="217" text-anchor="middle" class="l">Escalation</text>

  <!-- Blue arrows (main flow) -->
  <path d="M 420 72 Q 460 72 430 140" class="ab"/>
  <path d="M 610 162 L 610 200 Q 610 240 600 262" class="ab"/>
  <path d="M 400 262 L 420 352" class="ab"/>
  <path d="M 220 352 Q 160 352 125 284" class="ab"/>
  <path d="M 125 240 L 115 184" class="ab"/>
  <path d="M 200 162 Q 210 100 220 94" class="ab"/>

  <!-- Orange arrows (escalation) -->
  <path d="M 115 184 Q 200 200 220 212" class="ao"/>
  <path d="M 380 212 Q 440 200 430 162" class="ao"/>

  <!-- Caption -->
  <text x="320" y="415" text-anchor="middle" class="sub">A controlled communication loop replaces fragmented interactions</text>
</svg>
