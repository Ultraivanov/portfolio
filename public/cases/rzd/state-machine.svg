<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" fill="none" font-family="IBM Plex Sans, system-ui, sans-serif">
  <defs>
    <marker id="a" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="#3B82F6"/></marker>
    <marker id="ao" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="#F59E0B"/></marker>
  </defs>
  <style>
    .pill{fill:#EFF6FF;stroke:#3B82F6;stroke-width:1.8;rx:20} .pill-o{fill:#FEF3C7;stroke:#F59E0B;stroke-width:1.8;rx:20}
    .lp{fill:#3B82F6;font-size:13px;font-weight:600} .lo{fill:#B45309;font-size:13px;font-weight:600}
    .ar{stroke:#3B82F6;stroke-width:1.5;fill:none;marker-end:url(#a)} .aro{stroke:#F59E0B;stroke-width:1.4;stroke-dasharray:5 3;fill:none;marker-end:url(#ao)}
    .tl{fill:#6B7280;font-size:10px;font-weight:500} .sub{fill:#888;font-size:10.5px;font-style:italic}
  </style>

  <text x="360" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a1a">State System</text>

  <!-- Initial state dot -->
  <circle cx="30" cy="80" r="8" fill="#3B82F6"/>

  <!-- Draft -->
  <rect x="50" y="60" width="110" height="40" class="pill" rx="20"/>
  <text x="105" y="85" text-anchor="middle" class="lp">Draft</text>

  <!-- Sent -->
  <rect x="200" y="60" width="110" height="40" class="pill" rx="20"/>
  <text x="255" y="85" text-anchor="middle" class="lp">Sent</text>

  <!-- Received -->
  <rect x="350" y="60" width="120" height="40" class="pill" rx="20"/>
  <text x="410" y="85" text-anchor="middle" class="lp">Received</text>

  <!-- Answered -->
  <rect x="510" y="60" width="120" height="40" class="pill" rx="20"/>
  <text x="570" y="85" text-anchor="middle" class="lp">Answered</text>

  <!-- Closed -->
  <rect x="600" y="160" width="100" height="40" class="pill" rx="20"/>
  <text x="650" y="185" text-anchor="middle" class="lp">Closed</text>

  <!-- Final state double circle -->
  <circle cx="650" cy="230" r="6" fill="none" stroke="#3B82F6" stroke-width="2"/>
  <circle cx="650" cy="230" r="3" fill="#3B82F6"/>

  <!-- Escalated (orange) -->
  <rect x="320" y="180" width="140" height="40" class="pill-o" rx="20"/>
  <text x="390" y="205" text-anchor="middle" class="lo">Escalated</text>

  <!-- Main flow arrows -->
  <line x1="38" y1="80" x2="50" y2="80" class="ar"/>
  <line x1="160" y1="80" x2="200" y2="80" class="ar"/>
  <text x="180" y="74" text-anchor="middle" class="tl">submit</text>

  <line x1="310" y1="80" x2="350" y2="80" class="ar"/>
  <text x="330" y="74" text-anchor="middle" class="tl">deliver</text>

  <line x1="470" y1="80" x2="510" y2="80" class="ar"/>
  <text x="490" y="74" text-anchor="middle" class="tl">respond</text>

  <!-- Answered → Closed -->
  <path d="M 620 100 Q 650 130 650 160" class="ar"/>
  <text x="660" y="130" class="tl">accept</text>

  <!-- Closed → Final -->
  <line x1="650" y1="200" x2="650" y2="224" class="ar"/>

  <!-- Answered → Escalated -->
  <path d="M 540 100 Q 460 140 390 180" class="aro"/>
  <text x="490" y="140" class="tl" fill="#B45309">escalate</text>

  <!-- Escalated → Received (loop back) -->
  <path d="M 390 180 Q 390 130 410 100" class="aro"/>
  <text x="375" y="145" class="tl" fill="#B45309">re-route</text>

  <!-- Caption -->
  <text x="360" y="275" text-anchor="middle" class="sub">Explicit state system eliminates ambiguity and improves predictability</text>
</svg>
