<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" fill="none" font-family="IBM Plex Sans, system-ui, sans-serif">
  <defs>
    <marker id="a" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="#3B82F6"/></marker>
  </defs>
  <style>
    .layer{stroke:#3B82F6;stroke-width:1.5;rx:8} .layer-fill{fill:#EFF6FF}
    .lbl{fill:#3B82F6;font-size:13px;font-weight:600} .sub-lbl{fill:#6B7280;font-size:10.5px}
    .ar{stroke:#3B82F6;stroke-width:1.5;fill:none;marker-end:url(#a)}
    .ui-layer{stroke:#9CA3AF;stroke-width:1.5;rx:8} .ui-fill{fill:#F3F4F6} .ui-lbl{fill:#6B7280;font-size:13px;font-weight:600}
    .note{fill:#888;font-size:10px;font-style:italic}
  </style>

  <text x="200" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a1a">System Architecture</text>

  <!-- Layer 1: User Input -->
  <rect x="80" y="50" width="240" height="44" class="layer-fill" class="layer" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="200" y="77" text-anchor="middle" class="lbl">User Input</text>

  <!-- Layer 2: Category Selection / Routing -->
  <rect x="80" y="120" width="240" height="44" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5" rx="8"/>
  <text x="200" y="147" text-anchor="middle" class="lbl">Routing Logic</text>

  <!-- Layer 3: State Machine -->
  <rect x="80" y="190" width="240" height="44" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2" rx="8"/>
  <text x="200" y="217" text-anchor="middle" class="lbl">State Machine</text>
  <text x="200" y="228" text-anchor="middle" class="sub-lbl">core control layer</text>

  <!-- Layer 4: Notifications -->
  <rect x="80" y="270" width="240" height="44" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5" rx="8"/>
  <text x="200" y="297" text-anchor="middle" class="lbl">Notification System</text>

  <!-- Layer 5: Interfaces (gray — UI is last) -->
  <rect x="40" y="350" width="140" height="44" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5" rx="8"/>
  <text x="110" y="377" text-anchor="middle" class="ui-lbl">User Interface</text>

  <rect x="220" y="350" width="140" height="44" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5" rx="8"/>
  <text x="290" y="377" text-anchor="middle" class="ui-lbl">Manager Interface</text>

  <!-- Arrows down -->
  <line x1="200" y1="94" x2="200" y2="120" class="ar"/>
  <line x1="200" y1="164" x2="200" y2="190" class="ar"/>
  <line x1="200" y1="234" x2="200" y2="270" class="ar"/>

  <!-- Notifications split to two interfaces -->
  <path d="M 160 314 L 110 350" class="ar"/>
  <path d="M 240 314 L 290 350" class="ar"/>

  <!-- Feedback arrows from interfaces back to state machine -->
  <path d="M 110 394 Q 110 430 60 430 Q 20 430 20 212 Q 20 200 80 212" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="4 3" fill="none" marker-end="url(#a)"/>
  <path d="M 290 394 Q 290 450 340 450 Q 380 450 380 212 Q 380 200 320 212" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="4 3" fill="none" marker-end="url(#a)"/>

  <!-- Labels for feedback -->
  <text x="15" y="320" class="note">user action</text>
  <text x="345" y="340" class="note">manager action</text>

  <!-- Key insight callout -->
  <text x="200" y="490" text-anchor="middle" class="note">UI is the last layer — not the first</text>
</svg>
