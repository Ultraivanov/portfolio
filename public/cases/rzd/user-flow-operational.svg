<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 680" fill="none" font-family="IBM Plex Sans, system-ui, sans-serif">
  <defs>
    <marker id="a" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="#3B82F6"/></marker>
    <marker id="ag" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto"><polygon points="0 0,7 2.5,0 5" fill="#888"/></marker>
  </defs>
  <style>
    .act{fill:#3B82F6;rx:6} .st{fill:#f0f4ff;stroke:#3B82F6;stroke-width:1.5;rx:20} .dec{fill:#fff;stroke:#F59E0B;stroke-width:2;rx:4}
    .la{fill:#fff;font-size:12px;font-weight:600} .ls{fill:#3B82F6;font-size:12px;font-weight:600} .ld{fill:#F59E0B;font-size:11px;font-weight:700}
    .ar{stroke:#3B82F6;stroke-width:1.8;fill:none;marker-end:url(#a)} .arb{stroke:#888;stroke-width:1.3;stroke-dasharray:5 3;fill:none;marker-end:url(#ag)}
    .sub{fill:#888;font-size:10.5px;font-style:italic}
  </style>

  <text x="240" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a1a">User Flow</text>

  <!-- Actions (rectangles) -->
  <rect x="140" y="50" width="200" height="40" class="act" rx="6"/>
  <text x="240" y="75" text-anchor="middle" class="la">Create Request</text>

  <rect x="140" y="110" width="200" height="40" class="act" rx="6"/>
  <text x="240" y="135" text-anchor="middle" class="la">Submit</text>

  <!-- Statuses (rounded pills) -->
  <rect x="155" y="170" width="170" height="36" class="st" rx="18"/>
  <text x="240" y="193" text-anchor="middle" class="ls">Sent</text>

  <rect x="130" y="226" width="220" height="40" class="act" rx="6"/>
  <text x="240" y="251" text-anchor="middle" class="la">Delivered to Manager</text>

  <rect x="155" y="286" width="170" height="36" class="st" rx="18"/>
  <text x="240" y="309" text-anchor="middle" class="ls">Received</text>

  <rect x="140" y="342" width="200" height="40" class="act" rx="6"/>
  <text x="240" y="367" text-anchor="middle" class="la">Manager Response</text>

  <rect x="155" y="402" width="170" height="36" class="st" rx="18"/>
  <text x="240" y="425" text-anchor="middle" class="ls">Answered</text>

  <rect x="140" y="458" width="200" height="40" class="act" rx="6"/>
  <text x="240" y="483" text-anchor="middle" class="la">User Reviews</text>

  <!-- Decision diamond -->
  <polygon points="240,520 310,555 240,590 170,555" class="dec"/>
  <text x="240" y="559" text-anchor="middle" class="ld">?</text>

  <!-- Accept branch -->
  <rect x="60" y="620" width="150" height="36" class="st" rx="18"/>
  <text x="135" y="643" text-anchor="middle" class="ls">Closed</text>

  <!-- Escalate branch -->
  <rect x="270" y="620" width="160" height="36" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5" rx="18"/>
  <text x="350" y="643" text-anchor="middle" fill="#B45309" font-size="12px" font-weight="600">Escalate</text>

  <!-- Arrows -->
  <line x1="240" y1="90" x2="240" y2="110" class="ar"/>
  <line x1="240" y1="150" x2="240" y2="170" class="ar"/>
  <line x1="240" y1="206" x2="240" y2="226" class="ar"/>
  <line x1="240" y1="266" x2="240" y2="286" class="ar"/>
  <line x1="240" y1="322" x2="240" y2="342" class="ar"/>
  <line x1="240" y1="382" x2="240" y2="402" class="ar"/>
  <line x1="240" y1="438" x2="240" y2="458" class="ar"/>
  <line x1="240" y1="498" x2="240" y2="520" class="ar"/>

  <!-- Decision branches -->
  <path d="M 205 555 L 135 620" class="arb"/>
  <text x="148" y="590" class="ld">Accept</text>
  <path d="M 275 555 L 350 620" class="arb"/>
  <text x="330" y="590" class="ld">Escalate</text>

  <!-- Loop-back from Escalate to Delivered -->
  <path d="M 430 638 Q 460 638 460 400 Q 460 246 350 246" class="arb" stroke-dasharray="5 3"/>

  <!-- Caption -->
  <text x="240" y="676" text-anchor="middle" class="sub">Linear flow reduces ambiguity and enforces predictability</text>
</svg>
